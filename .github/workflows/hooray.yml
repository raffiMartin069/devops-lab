name: Hooraaay!!

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Comment with a fun message
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const messages = [
              "🚀 Great PR, commander! Launch sequence engaged.",
              "🎉 Another PR, another party! Let's celebrate.",
              "🛠️ Time to review! The bots are watching.",
              "🔥 That code is lit! 🔥 Let's give it a look.",
              "👏 Thanks for the contribution! You're awesome."
            ];

            const gifs = [
              "https://media.giphy.com/media/l0ExdMHUDKteztyfe/giphy.gif",
              "https://media.giphy.com/media/26FPGMHZpA6E0iDfq/giphy.gif",
              "https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif",
              "https://media.giphy.com/media/3orieWRr3zzkI2G2ls/giphy.gif",
              "https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif"
            ];

            const message = messages[Math.floor(Math.random() * messages.length)];
            const gif = gifs[Math.floor(Math.random() * gifs.length)];

            const body = `${message}\n\n![fun](${gif})`;

            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
